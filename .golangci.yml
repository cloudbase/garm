version: "2"
linters:
  default: none
  enable:
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gosec
    - govet
    - importas
    - ineffassign
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    goconst:
      # goconst v1.11 (bundled since golangci-lint v2.13) started scanning
      # strings inside composite literals (slice/map/struct literals), which
      # older versions never visited. That floods the repo with findings for
      # idiomatic repetition (CLI table headers, metric label names, test
      # fixtures). Exclude them to keep the pre-v2.13 behavior. Note that
      # setting exclude-types replaces the default ("call"), so it must be
      # listed here as well.
      exclude-types:
        - Call
        - CompositeLit
    gosec:
      excludes:
        - G101
        - G115
        - G117
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/cloudbase/garm)
    goimports:
      local-prefixes:
        - github.com/cloudbase/garm
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
